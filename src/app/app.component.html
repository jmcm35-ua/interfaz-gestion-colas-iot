<div class="absolute inset-0 flex flex-col min-w-0 overflow-hidden bg-transparent">

    <mat-drawer-container class="flex-auto h-full">

        <!-- Drawer -->
        <mat-drawer
          style="width: 300px;"
            
            [autoFocus]="false"
            [mode]="drawerMode"
            [opened]="drawerOpened"
            [position]="'end'"
            #matDrawer>
            
            <app-configuration class="h-full"></app-configuration>
        </mat-drawer>

        <!-- Drawer content -->
        <mat-drawer-content class="flex flex-col overflow-hidden">

            <!-- Header -->
            <div class="flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between h-16 sm:py-8 sm:px-10 border-b bg-card dark:bg-transparent">
                <div class="flex-1 min-w-0">
                    <!-- Title -->
                    <div class="mt-2">
                        <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight leading-7 sm:leading-10 truncate">
                          Simulador Colas
                        </h2>
                    </div>
                </div>
                <!-- Actions -->
                <div class="flex shrink-0 items-center mt-6 sm:mt-0 sm:ml-4 text-white gap-2"> 
                  <button
                    mat-icon-button
                    [matTooltip]="'Gestión de archivos'">
                    <mat-icon [svgIcon]="'heroicons_solid:archive-box-arrow-down'"></mat-icon>
                  </button>
                  <button
                    mat-icon-button
                    [matTooltip]="tooltip || 'Configuración'"
                    (click)="matDrawer.toggle()">
                    <mat-icon [svgIcon]="'heroicons_solid:bars-3'"></mat-icon>
                  </button>
                </div>
            </div>

            <!-- Main -->
            <div
                class="flex-auto p-2 overflow-y-auto flex-1"
                cdkScrollable>

                <!-- CONTENT GOES HERE -->
                <div class="h-full border-2 border-dashed border-gray-300 rounded-2xl">
                  <app-dashboard class="h-full flex flex-1"></app-dashboard>
                </div>

            </div>

        </mat-drawer-content>

    </mat-drawer-container>

</div>

<router-outlet></router-outlet>
