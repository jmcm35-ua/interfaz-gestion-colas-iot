
<div class="absolute inset-0 flex flex-col min-w-0 overflow-hidden bg-transparent">

    <mat-drawer-container class="flex-auto h-full">

        <!-- Drawer -->
        <mat-drawer
          style="width: 300px;"
            
            [autoFocus]="false"
            [mode]="drawerMode"
            [opened]="drawerOpened"
            [position]="'end'"
            #matDrawer>
            
            <app-configuration class="h-full"></app-configuration>
        </mat-drawer>

        <!-- Drawer content -->
        <mat-drawer-content class="flex flex-col overflow-hidden">

            <!-- Header -->
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between w-full py-2 px-6 md:px-10 border-b bg-card dark:bg-transparent transition-all">
    
                <div class="flex flex-col sm:flex-row sm:items-baseline gap-4 w-full sm:w-auto">
                    <img class="h-[40px] m-auto" src="assets/images/logo/logo-text-white.png" alt="">
                    <!-- <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight text-slate-900 dark:text-white leading-none">
                        Simulador Colas

                    </h2> -->

                    <div class="flex items-center gap-3 bg-slate-100 dark:bg-slate-800 p-1.5 rounded-2xl shadow-sm">
    
                        <button mat-mini-fab 
                            color="primary" 
                            class="shadow-none transition-all duration-200"
                            [class.text-primary]="isInitialized"
                            [class.bg-primary-300]="isInitialized"
                            (click)="toggleStateSimulation()"
                            [matTooltip]="isRuning ? 'Pausar' : 'Reproducir'">
                        
                        <div class="icon-wrapper">
                            <mat-icon [svgIcon]="'heroicons_solid:play'"
                                    [class.icon-visible]="!isRuning"
                                    [class.icon-hidden]="isRuning">
                            </mat-icon>
                            
                            <mat-icon [svgIcon]="'heroicons_solid:pause'"
                                    [class.icon-visible]="isRuning"
                                    [class.icon-hidden]="!isRuning">
                            </mat-icon>
                        </div>
                    </button>

                        <button mat-mini-fab 
                            class="transition-colors duration-200"
                            [class.text-red-600]="isInitialized"
                            [class.text-slate-500]="!isInitialized"
                            [matTooltip]="'Detener'"
                            (click)="stopSimulation()"
                            >
                            <mat-icon class="icon-size-6" [svgIcon]="'heroicons_solid:stop'"></mat-icon>
                        </button>
                    </div>
                </div>

    <div class="flex items-center mt-6 sm:mt-0 gap-3">
        <div class="relative">
            <button mat-icon-button
                    (click)="openFiles($event)"
                    class="text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700"
                    [matTooltip]="'Gestión de archivos'">
                <mat-icon [svgIcon]="'heroicons_solid:archive-box-arrow-down'"></mat-icon>
            </button>

            <app-files 
                [hidden]="!showFiles"
                #filesPanel
                class="absolute right-0 mt-3 z-50 w-80 shadow-2xl rounded-2xl border border-slate-200 dark:border-slate-700 bg-card overflow-hidden transition-all">
            </app-files>
        </div>

        <div class="h-6 w-px bg-slate-300 dark:bg-slate-700 mx-1"></div>

        <button mat-icon-button
                class="text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700"
                [matTooltip]="tooltip || 'Configuración'"
                (click)="matDrawer.toggle()">
            <mat-icon [svgIcon]="'heroicons_solid:bars-3'"></mat-icon>
        </button>
    </div>
</div>

            <!-- Main -->
            <div
                class="flex-auto p-4 overflow-y-auto flex-1"
                cdkScrollable>

                  <app-dashboard></app-dashboard>

            </div>

        </mat-drawer-content>

    </mat-drawer-container>

</div>

<router-outlet></router-outlet>
