<section class="p-6 min-h-screen w-full text-slate-100 font-sans">
  
    <section class="gap-6 w-full mb-6" style="display: grid; grid-template-columns: 1fr 560px; ">
      <div class="bg-[#131722] p-4 rounded-xl border border-slate-800 relative min-w-0">
        <h2 class="text-sm font-semibold text-slate-300 mb-3">IoT Broker: Dispersión de Producción</h2>
        <div class="bg-[#131722] p-4 rounded-xl border border-slate-800 absolute top-0 right-0">
          <p class="text-sm text-slate-400">Total Mensajes</p>
          <span class="text-2xl font-bold text-blue-500" #totalMessages>0</span>
        </div>
        <canvas #scatterBroker height="300" style="max-height: 300px !important;"></canvas>
      </div>
  
      <div class="bg-[#131722] p-4 rounded-xl border border-slate-800 justify-between relative min-w-0" style="display: grid; grid-template-columns: 1fr 180px;">
        <div class="flex flex-col">
          <h2 class="text-sm font-semibold text-slate-300 mb-3">Cosnumer: Distribución de Carga</h2>
          <canvas #pieCategoriser height="300" style="max-height: 300px !important;"></canvas>
        </div>
        <div class="flex flex-col absolute top-0 right-0 h-full w-[180px]">
          <span class="flex-none text-sm font-semibold text-slate-300 my-3 text-center w-full">
            Procesamiento medio
          </span>
          <div *ngFor="let q of dataQueuesTime; let i = index" 
              #queueCanvas 
              class="flex-1 bg-[#131722] grid grid-cols-3 px-4 rounded-l-xl border items-center justify-between border-slate-800 {{i == dataQueuesTime.length-1 ? 'rounded-br-xl' : ''}}">
            <p class="text-sm text-slate-400">Cola {{i+1}}</p>
            <span class="text-2xl font-bold col-span-2" [style.color]="colors[i]">
              {{q}}ms
            </span>
          </div>
        </div>
      </div>
    </section>
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 ">
    <div class="bg-[#131722] p-4 rounded-xl border border-slate-800 lg:col-span-2 ">
      <h2 class="text-sm font-semibold text-slate-300 mb-3">Dispatcher: Procesamiento por Prioridad</h2>
      <canvas #lineConsumer height="300" style="max-height: 300px !important;"></canvas>
      
    </div>
  </div>
</section>
